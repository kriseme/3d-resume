<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人 3D 交互式简历" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%234f7fb8'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='white'%3E3D%3C/text%3E%3C/svg%3E" />
    <title>3D 交互简历</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="loading">正在加载 3D 形象…</div>

    <main id="track">
      <section class="chapter hero" id="chapter-hero">
        <div class="hero-content" id="hero-content">
          <p class="hero-kicker">PERSONAL 3D RESUME</p>
          <h1 class="hero-name-en" id="hero-name-en">YOUR NAME</h1>
          <p class="hero-name-zh" id="hero-name-zh">你的名字</p>
          <p class="hero-role" id="hero-role">你的职位</p>
        </div>
        <p class="hero-hint" id="hero-hint">点击 或 滚动开始</p>
      </section>

      <section class="chapter timeline" id="chapter-timeline">
        <svg class="timeline-curve" viewBox="0 0 100 400" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 95 0 Q 5 200 95 400" fill="none" stroke="rgba(79, 127, 184, 0)" stroke-width="1.5" />
        </svg>
        <div class="timeline-card card-edu" id="panel-edu">
          <p class="panel-label">EDUCATION</p>
          <h2 class="panel-title">教育经历</h2>
          <div class="panel-body" id="panel-edu-body"></div>
        </div>
        <div class="timeline-card card-projects" id="panel-projects">
          <p class="panel-label">PROJECTS</p>
          <h2 class="panel-title">项目经历</h2>
          <div class="panel-body" id="panel-projects-body"></div>
        </div>
        <div class="timeline-card card-skills" id="panel-skills">
          <p class="panel-label">SKILLS</p>
          <h2 class="panel-title">专业技能</h2>
          <div class="panel-body" id="panel-skills-body"></div>
        </div>
        <div class="timeline-card card-honors" id="panel-honors">
          <p class="panel-label">HONORS</p>
          <h2 class="panel-title">荣誉证书</h2>
          <div class="panel-body" id="panel-honors-body"></div>
        </div>
      </section>

      <section class="chapter final" id="chapter-final">
        <div class="final-accent" id="final-accent">
          <p class="panel-label">COMPLETE RESUME</p>
          <h2>完整简历</h2>
        </div>
        <aside class="resume-card" id="resume-card">
          <div class="resume-inner" id="resume-inner"></div>
        </aside>
      </section>
    </main>

    <nav class="progress-dots" id="progress-dots" aria-label="章节导航">
      <button class="progress-dot active" data-target="0" aria-label="首屏"></button>
      <button class="progress-dot" data-target="1" aria-label="教育经历"></button>
      <button class="progress-dot" data-target="2" aria-label="项目经历"></button>
      <button class="progress-dot" data-target="3" aria-label="专业技能"></button>
      <button class="progress-dot" data-target="4" aria-label="荣誉证书"></button>
      <button class="progress-dot" data-target="5" aria-label="完整简历"></button>
    </nav>

    <button class="print-btn" id="print-btn" type="button">打印 PDF</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
